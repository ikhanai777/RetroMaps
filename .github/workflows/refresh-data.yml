name: Refresh restaurant data

on:
  schedule:
    - cron: '30 22 * * *' # 02:30 Dubai time
  workflow_dispatch:
  push:
    branches: [main]
    paths: [js/osm.js, scripts/fetch-restaurants.mjs]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/fetch-restaurants.mjs
      - name: Commit snapshot if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/restaurants.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Refresh Dubai restaurant snapshot"
          git push
